name: iOS build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-framework:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-konan-

      - name: Print tool versions
        run: |
          xcodebuild -version
          java -version

      - name: Build Kotlin iOS frameworks
        run: |
          bash ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 :composeApp:linkDebugFrameworkIosArm64 --no-daemon

      - name: Build iOS simulator app
        run: |
          export OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package iOS simulator app
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/VRCM.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/SimulatorPayload/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/SimulatorPayload/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/SimulatorPayload" \
            "$RUNNER_TEMP/VRCM-iOS-Simulator.zip"

      - name: Upload iOS simulator package
        uses: actions/upload-artifact@v4
        with:
          name: VRCM-iOS-Simulator
          path: ${{ runner.temp }}/VRCM-iOS-Simulator.zip
          if-no-files-found: error

      - name: Build iOS device archive
        run: |
          set -euo pipefail
          export OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -archivePath "$RUNNER_TEMP/VRCM.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package iOS device IPA
        run: |
          set -euo pipefail
          bash iosApp/package-ipa.sh \
            "$RUNNER_TEMP/VRCM.xcarchive" \
            "$RUNNER_TEMP/VRCM-iOS-device.ipa"
          test -f "$RUNNER_TEMP/VRCM-iOS-device.ipa"

      - name: Upload iOS device IPA
        uses: actions/upload-artifact@v4
        with:
          name: VRCM-iOS-Device-IPA
          path: ${{ runner.temp }}/VRCM-iOS-device.ipa
          if-no-files-found: error
